name: Send Lesson Reminders

# Routine scheduling moved to an external cron-job.org job that hits
# /api/cron/lesson-reminders every minute (timezone Europe/Prague). GitHub Actions
# scheduled crons drop most runs (observed ~80-min gaps instead of */5), which made
# the 5-minute pre-lesson notification window unreliable. This workflow is kept only
# for manual runs; when dispatched it still polls the endpoint every ~55s for ~5
# minutes. Overlapping calls are harmless — the endpoint deduplicates per
# (user, date, hour).
on:
  workflow_dispatch: # Manual trigger only; routine scheduling is external (cron-job.org)

# Avoid piling up overlapping long-running jobs if a run is slow.
concurrency:
  group: lesson-reminders
  cancel-in-progress: false

jobs:
  lesson-reminders:
    name: Send Lesson Reminders
    runs-on: ubuntu-latest

    steps:
      - name: Poll Lesson Reminders Endpoint every minute for ~5 minutes
        run: |
          ITERATIONS=5
          SLEEP_BETWEEN=55

          call_endpoint() {
            HTTP_STATUS=$(curl -X GET "${{ secrets.VERCEL_URL }}/api/cron/lesson-reminders" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -w "\n%{http_code}" \
              -s -S \
              --connect-timeout 10 \
              --max-time 30 || echo -e "\n000")

            STATUS_CODE=$(echo "$HTTP_STATUS" | tail -1)
            BODY=$(echo "$HTTP_STATUS" | sed '$d')
            echo "[$(date -u +%H:%M:%S)] HTTP $STATUS_CODE — $BODY"
          }

          for i in $(seq 1 $ITERATIONS); do
            echo "Tick $i/$ITERATIONS"
            call_endpoint
            if [ "$i" -lt "$ITERATIONS" ]; then
              sleep $SLEEP_BETWEEN
            fi
          done

          echo "Reminder polling cycle complete"
