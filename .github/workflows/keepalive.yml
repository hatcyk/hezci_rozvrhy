name: Keep scheduled workflows alive

# GitHub disables every scheduled workflow after 60 days without commits
# (that is what silently stopped prefetch on 2026-08-15). Re-enabling a
# workflow through the API resets that counter, so do it once a week.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in prefetch.yml process-notifications.yml check-status.yml cleanup.yml lesson-reminders.yml keepalive.yml; do
            gh workflow enable "$wf" --repo "${{ github.repository }}" && echo "enabled $wf"
          done
