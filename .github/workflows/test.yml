name: Tests

# Unit tests on every push and pull request. Needs no secrets: Firebase,
# Bakaláři and FCM are replaced by in-memory fakes in test/helpers/.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node ${{ matrix.node }} / TZ ${{ matrix.tz }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']             # 22 = production (Vercel, Docker), 24 = next LTS
        tz: ['UTC', 'Europe/Prague']   # Vercel/GitHub run in UTC, a school server in Prague time
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests + coverage
        run: >
          node --test --experimental-test-coverage
          --test-coverage-include="backend/**" --test-coverage-include="routes/**"
          --test-coverage-lines=50
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          "test/**/*.test.js"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.node == '22' && matrix.tz == 'UTC'
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
