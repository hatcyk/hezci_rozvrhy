# Lepší Rozvrh — self-hosted deployment.
#
#   cp .env.example .env      # fill in the credentials
#   docker compose up -d --build
#
# The web app and the four scheduled jobs run in one container; scheduling is
# done by the host (see deploy/crontab.example) so a job can never overlap with
# a redeploy. See DEPLOYMENT.md.

services:
  app:
    build: .
    image: lepsi-rozvrh
    container_name: lepsi-rozvrh
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Prague
      NODE_ENV: production
      # Inside the container on every interface (the server's default is
      # 127.0.0.1); who can reach it is decided by `ports` below.
      HOST: 0.0.0.0
      # The client address for the rate limits comes from the proxy's X-Real-IP
      # (deploy/nginx.conf.example); without it every visitor would count as
      # the proxy. Only because the port below is reachable from this machine
      # alone: never with the port exposed directly, as anybody could then
      # pick their own address.
      TRUST_PROXY: "1"
    ports:
      # Bind to localhost only: nginx (or another reverse proxy) terminates TLS
      # and forwards here. Changing it to "3000:3000" (exposed directly) means
      # removing TRUST_PROXY above.
      - "127.0.0.1:3000:3000"
    volumes:
      # Service account file, if you use FIREBASE_SERVICE_ACCOUNT_PATH instead of
      # pasting the JSON into FIREBASE_SERVICE_ACCOUNT.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
